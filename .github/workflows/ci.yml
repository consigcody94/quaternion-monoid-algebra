name: tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests examples benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          # Topology extra is optional; the suite skips cleanly without it
          pip install gudhi || echo "gudhi unavailable; topology test will skip"
      - name: Run pytest suite
        run: pytest -q
      - name: Run property test runner
        run: python tests/run_all.py
      - name: Run stress tests
        # The runner returns exit 0 with a SKIP if the TUM download is
        # unavailable, so a nonzero exit here is a genuine failure.
        run: python tests/stress_tests.py
