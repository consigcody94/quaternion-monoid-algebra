name: tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy gudhi persim
      - name: Run property test suite
        run: python tests/run_all.py
      # Stress tests download a public dataset; run only the offline subset in CI
      # by skipping the network test if the dataset is unavailable.
      - name: Run stress tests (offline-tolerant)
        run: python tests/stress_tests.py || true
